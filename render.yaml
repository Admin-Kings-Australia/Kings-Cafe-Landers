# Deploy only after reviewing Render's monthly service and storage charges.
services:
  - type: web
    name: kings-cafe-bookings
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: codex/shared-booking-system
    buildCommand: node booking-service/build-landing.mjs
    startCommand: node booking-service/server.mjs
    healthCheckPath: /bookings
    autoDeployTrigger: off
    disk:
      name: kings-booking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/bookings.sqlite
      - key: ALLOWED_ORIGINS
        value: https://admin-kings-australia.github.io
      - key: STAFF_PASSWORD
        generateValue: true
